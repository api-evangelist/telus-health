name: TELUS Health
kind: company
description: >-
  TELUS Health is the digital-health division of TELUS, one of Canada's largest
  telecommunications and technology companies, and the country's leading health-IT
  provider. It operates the PS Suite, Med Access, and cloud-native Collaborative
  Health Record (CHR) electronic medical records used across Canadian primary care,
  along with pharmacy management, virtual care, and employer/benefits health services.
  Its documented public integration surface is the CHR Enterprise API, a GraphQL
  endpoint secured with RS512-signed JWT bearer tokens that exposes clinic data
  (patients, appointments, encounters, clinical documents and more) for partner-built
  add-ons, complemented by the TELUS Patient Chart FHIR R4 implementation guide, a
  package of 89 published StructureDefinition profiles under the
  http://telus.com/fhir/patientChart canonical for standards-based patient-record
  exchange out of TELUS EMRs, and the Omara Health Exchange FHIR interoperability
  platform. Home market is Canada, where healthcare is province-fragmented and FHIR
  interoperability is stewarded federally by Canada Health Infoway. Both API surfaces
  are documented but gated behind a partner or CHR-domain agreement.
