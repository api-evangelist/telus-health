apis:
- aid: telus-health:telus-chr-enterprise-api
  name: TELUS CHR Enterprise API
  description: >-
    GraphQL API for the TELUS Collaborative Health Record (CHR) that lets partners
    build integrations against clinic data. Queries retrieve and mutations create or
    update CHR records (patients, appointments, encounters, clinical documents and
    more), exposed as a data graph following the GraphQL Cursor Connections spec
    (page size defaults to 50, max 100). Authenticated with RS512-signed JSON Web
    Tokens presented as Bearer tokens, with tokens expiring within 15 minutes. The
    GraphQL endpoint URL is provisioned per CHR domain in Settings, so no single
    fixed base host is published.
  humanURL: https://help.inputhealth.com/en/articles/6483215-chr-enterprise-api
  tags:
  - GraphQL
  - EMR
  - Healthcare
  - Interoperability
