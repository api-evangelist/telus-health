- aid: telus-health:telus-patient-chart-fhir-api
  name: TELUS Patient Chart FHIR API
  description: >-
    TELUS Patient Chart FHIR R4 implementation guide, published by TELUS, containing
    89 StructureDefinition profiles and extensions under the
    http://telus.com/fhir/patientChart canonical. Profiles cover patient-chart
    resources including AllergyIntolerance, CarePlan, ClinicalImpression, Composition,
    Condition, DiagnosticReport, DocumentReference, Encounter, MedicationRequest and
    a large set of medication/prescribing extensions, used to exchange patient-record
    data exported from TELUS EMRs. This is a conformance package (profiles/extensions);
    no TELUS CapabilityStatement or SMART-on-FHIR configuration is published.
  humanURL: https://simplifier.net/teluspatientchart
  baseURL: https://fhir.simplifier.net/TELUSPatientChart
  tags:
  - FHIR
  - HL7
  - Interoperability
  - Healthcare
  properties:
